name: Site checks

# Runs tools/check_site.py on every push and pull request.
#
# This is a deliberately different kind of workflow from the two that used to
# live here. update-navigation.yml and fix-audit-navigation.yml MODIFIED the
# site by regex and were removed; the second existed only to repair damage the
# first caused. This one is read-only — it never writes to the repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_sitemap.py reads each page's <lastmod> from `git log -1` on
          # that file. actions/checkout defaults to fetch-depth: 1, which
          # leaves exactly one commit of history, so git reports that single
          # commit's date for EVERY file and the regenerated sitemap comes out
          # uniformly stamped with today.
          #
          # The sitemap check below therefore was not comparing what it looked
          # like it was comparing. It passed only while the committed sitemap
          # happened to carry the same date as CI's HEAD commit — true whenever
          # the file was regenerated and pushed the same day, and false the
          # first time a session ran past midnight.
          #
          # Measured: a depth-1 clone of this repository produces 34 URLs all
          # dated the HEAD commit; full history produces 31 at one date and 3
          # at another.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run site checks
        run: python3 tools/check_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The course registry decides who gets access to which course and whose
      # progress is whose. Its two sharpest edges would both fail silently:
      # the original course's lesson prefix is the empty string, so a prefix
      # match in the wrong order sends every second-course id to the wrong
      # course; and a course with two live prices needs both honoured or one
      # price's buyers pay and get nothing. No dependencies, so it runs here
      # rather than in the Quality workflow.
      - name: Course registry and access tests
        run: node tools/check_courses.js

      - name: Confirm the sitemap is current
        # The sitemap is generated. If regenerating it produces a diff, someone
        # hand-edited it or added a page without updating tools/build_sitemap.py.
        run: |
          cp sitemap.xml /tmp/sitemap.before
          python3 tools/build_sitemap.py
          if ! diff -q /tmp/sitemap.before sitemap.xml > /dev/null; then
            echo "::error::sitemap.xml is out of date. Run: python3 tools/build_sitemap.py"
            diff /tmp/sitemap.before sitemap.xml || true
            exit 1
          fi
          echo "sitemap.xml is current"

      - name: Confirm the generators agree with the tree
        # Four times in one day a generator silently discarded what a later
        # pass had added: standardise_nav.py stripped the dropdown ARIA
        # attributes, build_articles.py stripped every Related reading block,
        # and build_articles.py twice restored article titles that had been
        # shortened afterwards for length. Each one shipped, because nothing
        # compared what the generators produce against what is committed.
        #
        # Running them and failing on any diff makes the tree the contract: if
        # a generator and the committed file disagree, one of them is wrong and
        # CI says so before a reader sees it. The scripts are idempotent, so on
        # an honest tree this produces no change.
        #
        # Deliberately not run here: build_sitemap.py (checked separately above,
        # since its lastmod comes from git history) and the one-shot migrations.
        run: |
          python3 tools/build_articles.py > /dev/null
          python3 tools/add_related_reading.py > /dev/null
          python3 tools/fix_article_seams.py > /dev/null
          python3 tools/standardise_nav.py > /dev/null
          python3 tools/standardise_footer.py > /dev/null
          python3 tools/fix_contrast.py > /dev/null
          python3 tools/sync_social_descriptions.py > /dev/null
          python3 tools/fix_mobile_nav_css.py > /dev/null
          python3 tools/wire_nav_aria.py > /dev/null
          python3 tools/ensure_dropdown_handler.py > /dev/null
          python3 tools/fix_nav_close_selector.py > /dev/null
          if ! git diff --quiet; then
            echo "::error::A generator disagrees with the committed tree."
            echo "Run the generators locally and commit the result, or update"
            echo "the generator so it produces what is committed."
            git --no-pager diff --stat
            git --no-pager diff | head -200
            exit 1
          fi
          echo "generators agree with the tree"
