name: Quality

# Runtime checks that tools/check_site.py cannot do, because it is static:
# real Core Web Vitals in a browser, and whether external links still resolve.
#
# Both are CI-only. Neither adds a runtime dependency to the site — package.json
# still carries just the three the Netlify Functions need.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # External links rot without anyone touching the repo, so check weekly.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal and external links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links are resolved against the checked-out files, so this
          # tests THIS commit rather than whatever is currently deployed.
          #
          # --root-dir is what lets root-relative hrefs resolve. The course
          # pages link to /catering-profit.html, which is correct in production
          # but means nothing to a checker reading a file off disk; without it
          # lychee reports them as unresolvable rather than checking them.
          args: >-
            --no-progress
            --include-fragments
            --root-dir "$GITHUB_WORKSPACE"
            --max-concurrency 8
            --timeout 20
            --retry-wait-time 5
            --max-retries 2
            --accept 200,206,429
            --exclude-path node_modules
            --exclude-path .lighthouseci
            './**/*.html' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
