<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Tre Coleman</title>
  <meta name="description" content="Reset your password to access your account.">
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trecoleman.com/forgot-password.html" />
    <meta property="og:title" content="Forgot Password | Tre Coleman" />
    <meta property="og:description" content="Reset your password to access your account." />
    <meta property="og:image" content="https://trecoleman.com/images/og-card.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Tre Coleman — restaurant operations consulting for restaurants, food trucks, and catering companies" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trecoleman.com/forgot-password.html" />
    <meta name="twitter:title" content="Forgot Password | Tre Coleman" />
    <meta name="twitter:description" content="Reset your password to access your account." />
    <meta name="twitter:image" content="https://trecoleman.com/images/og-card.jpg" />
    <!-- Self-hosted variable fonts: same origin, two files, no third-party
         chain in the critical path. crossorigin is required on a font
         preload even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/archivo-var-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/inter-var-latin.woff2" crossorigin>
    <link rel="stylesheet" href="ledger.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="analytics.js"></script>
</head>
<body class="ledger">
<a class="skip-link" href="#main-content">Skip to content</a>

  <a href="login.html" class="back-link">← Back to Login</a>

  <main id="main-content">
<div class="auth-container">
    <div class="auth-card">
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link</p>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="forgot-form" class="auth-form">
        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <button type="submit" id="submit-btn">Send Reset Link</button>
      </form>

      <div class="auth-links">
        <p>Remember your password? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
</main>

  <script>
    const form = document.getElementById('forgot-form');
    const errorEl = document.getElementById('error-message');
    const successEl = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const email = document.getElementById('email').value.trim();

      try {
        const response = await fetch('/.netlify/functions/auth-forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }

        successEl.textContent = 'If an account exists with this email, you will receive a password reset link shortly.';
        successEl.style.display = 'block';
        form.reset();

      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
