<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tre Coleman</title>
  <meta name="description" content="Log in to access your course content and materials.">
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trecoleman.com/login.html" />
    <meta property="og:title" content="Course Login | Tre Coleman" />
    <meta property="og:description" content="Log in to access your course content and materials." />
    <meta property="og:image" content="https://trecoleman.com/images/og-card.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Tre Coleman — restaurant operations consulting for restaurants, food trucks, and catering companies" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trecoleman.com/login.html" />
    <meta name="twitter:title" content="Course Login | Tre Coleman" />
    <meta name="twitter:description" content="Log in to access your course content and materials." />
    <meta name="twitter:image" content="https://trecoleman.com/images/og-card.jpg" />
    <!-- Self-hosted variable fonts: same origin, two files, no third-party
         chain in the critical path. crossorigin is required on a font
         preload even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/archivo-var-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/inter-var-latin.woff2" crossorigin>
    <link rel="stylesheet" href="ledger.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="analytics.js"></script>
</head>
<body class="ledger">
<a class="skip-link" href="#main-content">Skip to content</a>

  <a href="index.html" class="back-link">← Back to Home</a>

  <main id="main-content">
<div class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to access your course content</p>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="login-form" class="auth-form">
        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn">Log In</button>
      </form>

      <div class="auth-links">
        <p><a href="forgot-password.html">Forgot your password?</a></p>
        <p>Don't have an account? <a href="register.html">Create one</a></p>
      </div>
    </div>
  </div>
</main>

  <script>
    // Check if already logged in
    const session = localStorage.getItem('session');
    if (session) {
      window.location.href = '/course/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-message');
    const successEl = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/.netlify/functions/auth-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        // Check if response is JSON before parsing
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          console.error('Non-JSON response:', await response.text());
          throw new Error('Server error. The login service may not be deployed yet. Please try again later.');
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store session
        localStorage.setItem('session', JSON.stringify(data.session));
        localStorage.setItem('user', JSON.stringify(data.user));

        successEl.textContent = 'Login successful! Redirecting...';
        successEl.style.display = 'block';

        // Redirect to course dashboard
        setTimeout(() => {
          window.location.href = '/course/dashboard.html';
        }, 1000);

      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
