# Netlify configuration for Tre Coleman site

[build]
  # Publish directory (root of the site)
  publish = "."

  # Install dependencies for functions
  command = "npm install"

  # Functions directory
  functions = "netlify/functions"

# Functions configuration
[functions]
  # Node.js bundler
  node_bundler = "esbuild"
  # Include node_modules in the function bundle
  included_files = ["node_modules/**"]

# Redirect rules
[[redirects]]
  # Stripe success redirect
  from = "/success"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  # Stripe cancel redirect
  from = "/cancel"
  to = "/catering-profit.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep the Zoho domain-verification token out of the index.
# It is a bare token file, not HTML, so it cannot carry a <meta name="robots">
# tag — an X-Robots-Tag header is the only way to mark it noindex without
# altering the file contents and breaking Zoho verification.
[[headers]]
  for = "/zohoverify/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Paid course assets must never appear in search results. These are binary
# files that cannot carry a meta robots tag.
[[headers]]
  for = "/course/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The course archive at the site root is the complete paid product and is
# currently downloadable without payment. This header keeps it out of search
# results, but it does NOT restrict access — the file still needs to be
# deleted from the repo (its 26 files already exist under course/downloads/).
[[headers]]
  for = "/*.zip"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# MIME types for course downloads
[[headers]]
  for = "/**/*.xlsx"
  [headers.values]
    Content-Type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

[[headers]]
  for = "/**/*.docx"
  [headers.values]
    Content-Type = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

[[headers]]
  for = "/**/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"

# ---------------------------------------------------------------------------
# Blog URL migration (see tools/migrate_blog_urls.py)
# The posts originally shipped with generated filenames. These 301s keep any
# existing link, bookmark or index entry resolving to the new slug.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/blog/blog_post_1_profit_leaks_rewritten.html"
  to = "/blog/restaurant-profit-leaks.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/blog_post_2_systems_growth_rewritten.html"
  to = "/blog/restaurant-systems-for-growth.html"
  status = 301
  force = true

[[redirects]]
  from = "/blog/blog_post_3_menu_engineering_rewritten.html"
  to = "/blog/menu-engineering-guide.html"
  status = 301
