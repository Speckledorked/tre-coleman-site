<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Tre Coleman</title>
  <meta name="description" content="Create an account to access course content and materials.">
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trecoleman.com/register.html" />
    <meta property="og:title" content="Create Account | Tre Coleman" />
    <meta property="og:description" content="Create an account to access course content and materials." />
    <meta property="og:image" content="https://trecoleman.com/images/og-card.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Tre Coleman — restaurant operations consulting for restaurants, food trucks, and catering companies" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://trecoleman.com/register.html" />
    <meta name="twitter:title" content="Create Account | Tre Coleman" />
    <meta name="twitter:description" content="Create an account to access course content and materials." />
    <meta name="twitter:image" content="https://trecoleman.com/images/og-card.jpg" />
    <!-- Self-hosted variable fonts: same origin, two files, no third-party
         chain in the critical path. crossorigin is required on a font
         preload even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/archivo-var-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="fonts/inter-var-latin.woff2" crossorigin>
    <link rel="stylesheet" href="ledger.css" />
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="analytics.js"></script>
</head>
<body class="ledger">
<a class="skip-link" href="#main-content">Skip to content</a>

  <a href="index.html" class="back-link">← Back to Home</a>

  <main id="main-content">
<div class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="subtitle">Join to access exclusive course content</p>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="register-form" class="auth-form">
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
          <p class="password-requirements">At least 8 characters</p>
        </div>

        <div>
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn">Create Account</button>
      </form>

      <div class="auth-links">
        <p>Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
</main>

  <script>
    // Check if already logged in
    const session = localStorage.getItem('session');
    if (session) {
      window.location.href = '/course/dashboard.html';
    }

    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('error-message');
    const successEl = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Validate passwords match
      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const response = await fetch('/.netlify/functions/auth-register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        // Check if response is JSON before parsing
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          console.error('Non-JSON response:', await response.text());
          throw new Error('Server error. The registration service may not be deployed yet. Please try again later.');
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        successEl.innerHTML = 'Account created successfully! <a href="login.html">Log in now</a>';
        successEl.style.display = 'block';
        form.reset();

      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
