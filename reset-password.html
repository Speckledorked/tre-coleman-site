<body class="ledger">
<a class="skip-link" href="#main-content">Skip to content</a>

  <a href="login.html" class="back-link">← Back to Login</a>

  <main id="main-content">
<div class="auth-container">
    <div class="auth-card">
      <h1>Reset Password</h1>
      <p class="subtitle">Create a new password for your account</p>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="reset-form" class="auth-form">
        <div>
          <label for="password">New Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
          <p class="password-requirements">At least 8 characters</p>
        </div>

        <div>
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn">Reset Password</button>
      </form>

      <div class="auth-links">
        <p>Remember your password? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>
</main>

  <script src="course/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // This page handles the password reset callback from Supabase
    // The URL will contain hash parameters from Supabase auth

    const form = document.getElementById('reset-form');
    const errorEl = document.getElementById('error-message');
    const successEl = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');

    // Parse hash parameters
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const type = hashParams.get('type');

    if (!accessToken || type !== 'recovery') {
      errorEl.textContent = 'Invalid or expired reset link. Please request a new one.';
      errorEl.style.display = 'block';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters';
        errorEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        // Initialize Supabase client
        // Note: You'll need to replace these with your actual Supabase credentials
        const SUPABASE_URL = window.SUPABASE_URL || 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Set the session from the recovery link
        const { error: sessionError } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (sessionError) throw sessionError;

        // Update the password
        const { error: updateError } = await supabase.auth.updateUser({
          password: password
        });

        if (updateError) throw updateError;

        successEl.innerHTML = 'Password reset successfully! <a href="login.html">Log in with your new password</a>';
        successEl.style.display = 'block';
        form.style.display = 'none';

        // Clear the hash from URL
        history.replaceState(null, '', window.location.pathname);

      } catch (error) {
        console.error('Reset error:', error);
        errorEl.textContent = error.message || 'Failed to reset password. Please try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
